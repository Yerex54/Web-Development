<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexovate</title>
    <link rel="stylesheet" href="LayOut01.css">
</head>
<body>
    <div id="Wraped">
        <header>
            <div class="Logo_">
                <img src="nexovate (4).jpg" alt="Nexovate logo" width="200">
                <p>My group company: Nexovate</p>
            </div>
            <nav>
                <span>Home</span> |
                <span>Skills</span> |
                <span>Contacts</span>
            </nav>
        </header>

        <h1>Nexovate</h1>

        <div id="container">
            <div id="main-column">
                <h2>Come and work with us</h2>
                <p>Shishir Ahmed Joy</p>
                <img src="nexovate (2).png" alt="Nexovate group-photo" width="450">
            </div>

            <div id="side-column">
                <h2>Ask info</h2>
                <form>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email">
                    <br><br>
                    <label for="question">Question:</label><br>
                    <textarea id="question" name="question"></textarea>
                    <br><br>
                    <button type="submit">ASK</button>
                </form>
            </div>
        </div>

        <footer>
            <p>© Nexovate 2025</p>
            <p><em>Made by: Shishir Ahmed Joy </em></p>
        </footer>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexovate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1,h2,nav {color: #5B9BD5;}
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <header class="d-flex align-items-center">
            <div class="d-flex flex-column align-items-center">
                <img src="nexovate (4).jpg" alt="Nexovate logo" width="200">
                <p>My group company: Nexovate</p>
            </div>
            <nav class="text-center fw-bold ps-5">
                <span>Home</span> |
                <span>Skills</span> |
                <span>Contacts</span>
            </nav>
        </header>

        <h1 class=>Nexovate</h1>

        <div class="row g-3">
            <div class="col-12 col-sm-8">
                <h2>Come and work with us</h2>
                <p>Shishir Ahmed Joy</p>
                <img src="nexovate (2).png" alt="Nexovate group-photo" class="img-fluid">
            </div>

            <div class="col-12 col-sm-4">
                <h2>Ask info</h2>
                <form>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email">
                    <br><br>
                    <label for="question">Question:</label><br>
                    <textarea id="question" name="question"></textarea>
                    <br><br>
                    <button type="submit">ASK</button>
                </form>
            </div>
        </div>

        <footer>
            <p>© Nexovate 2025</p>
            <p><em>Made by: Shishir Ahmed Joy</em></p>
        </footer>
    </div>
</body>
</html>
